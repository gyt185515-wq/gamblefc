<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Web Casino Clicker</title>
<style>
  html,body { height:100%; margin:0; background:#0f0f14; color:#eee; font-family:Arial,Helvetica,sans-serif; }
  #ui { position: absolute; left:12px; top:12px; width:360px; max-width:40%; z-index:10; }
  .panel { background:#1b1b24; padding:12px; border-radius:8px; margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,0.6); }
  .big-btn { display:block; width:100%; padding:18px; font-size:20px; border-radius:8px; background:#2ecc71; color:#042; border:none; cursor:pointer; }
  .mode-btn { padding:8px 12px; margin-right:8px; border-radius:6px; border:none; cursor:pointer; }
  .game-btn, .tier-btn, #playBtn { padding:8px 10px; margin:6px 6px 6px 0; border-radius:6px; border:none; cursor:pointer; background:#333; color:#fff; }
  #canvas { width:100%; height:100%; display:block; }
  .small { font-size:13px; color:#cfcfcf; }
  .status { font-weight:700; font-size:18px; color:#ffd54f; }
  #message { margin-top:8px; min-height:22px; color:#9fe; }
  .right-panel { position:absolute; right:12px; top:12px; width:300px; max-width:30%; z-index:10; }
  .footer { position:absolute; left:12px; bottom:12px; color:#999; font-size:12px; }
  .selected { outline:2px solid #ffd54f; background:#444; }
</style>
</head>
<body>
<div id="ui">
  <div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div class="status" id="bankroll">$0</div>
        <div class="small">Bankroll</div>
      </div>
      <div>
        <div class="status" id="total">$0</div>
        <div class="small">Total Earned</div>
      </div>
    </div>
    <div style="margin-top:10px;">
      <button class="mode-btn" id="earnMode">Earn</button>
      <button class="mode-btn" id="gambleMode">Gamble</button>
    </div>
    <div id="earnPanel" style="margin-top:12px;">
      <button class="big-btn" id="earnBtn">EARN<br><span style="font-size:14px">Click to earn</span></button>
      <div style="margin-top:8px;">
        <div class="small">Click value: <span id="clickValue">$1</span></div>
      </div>
    </div>

    <div id="gamblePanel" style="display:none;margin-top:12px;">
      <div class="small">Choose Game</div>
      <div id="games"></div>
      <div style="margin-top:8px;" class="small">Choose Tier</div>
      <div id="tiers"></div>
      <div style="margin-top:8px;">
        <button id="playBtn" class="game-btn">PLAY</button>
      </div>
      <div id="message"></div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="panel">
    <div style="font-weight:700">Selected</div>
    <div id="selectedInfo" class="small">Mode: Earn</div>
    <hr style="border:none;height:1px;background:#2b2b33;margin:8px 0;">
    <div style="font-weight:700">Goal</div>
    <div class="small">Reach <strong>$1,000,000</strong> total earned</div>
  </div>
</div>

<canvas id="canvas"></canvas>
<div class="footer">Simple web casino demo — Roulette & Bingo — Paste into Google Sites embed</div>

<!-- Three.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* -------------------------
   Game state & tiers
   ------------------------- */
let bankroll = 50;
let totalEarned = 50;
const GOAL = 1_000_000;
let clickValue = 1;

const TIERS = [
  {stake:1, mult:5, desc:"Low risk"},
  {stake:5, mult:8, desc:"Small risk"},
  {stake:10, mult:12, desc:"Moderate risk"},
  {stake:50, mult:30, desc:"High risk"},
  {stake:100, mult:70, desc:"Very high risk"},
  {stake:1000, mult:500, desc:"Extreme risk"}
];

let mode = 'earn'; // 'earn' or 'gamble'
let selectedGame = null;
let selectedTier = 0;

/* -------------------------
   UI wiring
   ------------------------- */
const bankrollEl = document.getElementById('bankroll');
const totalEl = document.getElementById('total');
const clickValueEl = document.getElementById('clickValue');
const earnPanel = document.getElementById('earnPanel');
const gamblePanel = document.getElementById('gamblePanel');
const selectedInfo = document.getElementById('selectedInfo');
const messageEl = document.getElementById('message');

function fmt(n){ return '$' + Math.floor(n).toLocaleString(); }
function updateUI(){
  bankrollEl.textContent = fmt(bankroll);
  totalEl.textContent = fmt(totalEarned);
  clickValueEl.textContent = fmt(clickValue);
  selectedInfo.innerHTML = `Mode: ${mode.charAt(0).toUpperCase()+mode.slice(1)}<br>Game: ${selectedGame||'-'}<br>Tier: ${TIERS[selectedTier].stake ? fmt(TIERS[selectedTier].stake) : '-'}`;
}
updateUI();

document.getElementById('earnMode').onclick = () => {
  mode='earn'; earnPanel.style.display='block'; gamblePanel.style.display='none'; messageEl.textContent=''; updateUI();
};
document.getElementById('gambleMode').onclick = () => {
  mode='gamble'; earnPanel.style.display='none'; gamblePanel.style.display='block'; messageEl.textContent=''; updateUI();
};

document.getElementById('earnBtn').onclick = () => {
  bankroll += clickValue;
  totalEarned += clickValue;
  messageEl.textContent = `You earned ${fmt(clickValue)} by clicking.`;
  checkGoal();
  updateUI();
};

/* -------------------------
   Games & tiers UI
   ------------------------- */
const games = ['Roulette','Bingo'];
const gamesDiv = document.getElementById('games');
games.forEach(g=>{
  const b = document.createElement('button');
  b.className='game-btn';
  b.textContent = g;
  b.onclick = ()=>{ selectedGame=g; Array.from(gamesDiv.children).forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); updateUI(); messageEl.textContent=`Selected ${g}`; };
  gamesDiv.appendChild(b);
});

const tiersDiv = document.getElementById('tiers');
TIERS.forEach((t,i)=>{
  const b = document.createElement('button');
  b.className='tier-btn';
  b.textContent = fmt(t.stake);
  b.onclick = ()=>{ selectedTier=i; Array.from(tiersDiv.children).forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); updateUI(); messageEl.textContent=`Selected tier ${fmt(t.stake)} → payout ${fmt(t.stake*t.mult)}`; };
  if(i===0) b.classList.add('selected');
  tiersDiv.appendChild(b);
});

document.getElementById('playBtn').onclick = ()=> {
  if(mode!=='gamble'){ messageEl.textContent='Switch to Gamble mode first.'; return; }
  if(!selectedGame){ messageEl.textContent='Choose a game.'; return; }
  const tier = TIERS[selectedTier];
  if(bankroll < tier.stake){ messageEl.textContent='Not enough bankroll for that stake.'; return; }
  if(selectedGame==='Roulette') playRoulette(tier);
  else if(selectedGame==='Bingo') playBingo(tier);
};

/* -------------------------
   Payout helper & goal
   ------------------------- */
function bankrollAdd(amount){
  bankroll += amount;
  totalEarned += Math.max(0, amount); // only count positive earnings toward total
  updateUI();
  checkGoal();
}

function checkGoal(){
  if(totalEarned >= GOAL){
    messageEl.innerHTML = `<strong>CONGRATS! You reached ${fmt(totalEarned)} — Goal achieved!</strong>`;
  }
}

/* -------------------------
   Simple 3D scene (Three.js)
   Dealer model made from primitives
   ------------------------- */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0f0f14);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,6,14);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enablePan=false; controls.minDistance=6; controls.maxDistance=40; controls.maxPolarAngle=Math.PI/2.2;

const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(5,10,7);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404050, 0.8));

const floorGeo = new THREE.PlaneGeometry(80,80);
const floorMat = new THREE.MeshStandardMaterial({color:0x121217});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1;
scene.add(floor);

/* Dealer */
const dealer = new THREE.Group();
function makeDealer(){
  dealer.clear && dealer.clear();
  // body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.6,0.6), new THREE.MeshStandardMaterial({color:0x2f7f9f}));
  body.position.y = 0.2;
  dealer.add(body);
  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), new THREE.MeshStandardMaterial({color:0xfff1e6}));
  head.position.y = 1.05;
  dealer.add(head);
  // eyes
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), new THREE.MeshStandardMaterial({color:0x000000}));
  eyeL.position.set(-0.09,1.08,0.28);
  dealer.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.09; dealer.add(eyeR);
  // arms
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.9,0.18), new THREE.MeshStandardMaterial({color:0x2f7f9f}));
  armL.position.set(-0.9,0,0);
  dealer.add(armL);
  const armR = armL.clone(); armR.position.x = 0.9; dealer.add(armR);
  // hat
  const hat = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.12,0.8), new THREE.MeshStandardMaterial({color:0x111111}));
  hat.position.set(0,1.35,0);
  dealer.add(hat);
  dealer.position.set(4,0,-4);
  scene.add(dealer);
}
makeDealer();

/* Simple roulette wheel object */
const wheelGroup = new THREE.Group();
function makeWheel(){
  wheelGroup.clear && wheelGroup.clear();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,0.2,32), new THREE.MeshStandardMaterial({color:0x222222}));
  base.rotation.x = Math.PI/2;
  base.position.set(0,0.05,2);
  wheelGroup.add(base);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(3.0,0.25,16,64), new THREE.MeshStandardMaterial({color:0x333333}));
  rim.rotation.x = Math.PI/2;
  rim.position.set(0,0.15,2);
  wheelGroup.add(rim);
  // pockets
  const pockets = 12;
  for(let i=0;i<pockets;i++){
    const ang = i*(Math.PI*2/pockets);
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.9), new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(i/pockets,0.7,0.5)}));
    col.position.set(Math.cos(ang)*2.6,0.2,2+Math.sin(ang)*2.6);
    col.rotation.y = -ang;
    wheelGroup.add(col);
  }
  // ball
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12,12,12), new THREE.MeshStandardMaterial({color:0xffffff}));
  ball.position.set(0,0.6,2);
  ball.name = 'ball';
  wheelGroup.add(ball);
  scene.add(wheelGroup);
}
makeWheel();

/* Resize handling */
window.addEventListener('resize', ()=> {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

/* Animation loop */
let dealerArmAngle = 0, dealerDir = 1;
function animate(){
  requestAnimationFrame(animate);
  // dealer idle
  dealer.rotation.y += 0.2 * 0.01;
  dealerArmAngle += 0.6 * dealerDir;
  if(Math.abs(dealerArmAngle) > 12) dealerDir *= -1;
  dealer.children.forEach(c=>{
    if(c.geometry && c.geometry.type==='BoxGeometry' && c.position.x < -0.5) c.rotation.z = Math.sin(dealerArmAngle*Math.PI/180)*0.35;
    if(c.geometry && c.geometry.type==='BoxGeometry' && c.position.x > 0.5) c.rotation.z = -Math.sin(dealerArmAngle*Math.PI/180)*0.35;
  });
  renderer.render(scene, camera);
}
animate();

/* -------------------------
   Roulette logic
   ------------------------- */
let wheelSpinning = false;
function playRoulette(tier){
  if(wheelSpinning) { messageEl.textContent='Wheel is spinning...'; return; }
  bankroll -= tier.stake;
  updateUI();
  messageEl.textContent = `Spinning roulette for ${fmt(tier.stake)}...`;
  wheelSpinning = true;
  // spin animation: rotate wheelGroup over 2.5s
  const duration = 2500;
  const start = performance.now();
  const startRot = wheelGroup.rotation.y;
  const extra = (Math.random()*2+2)*Math.PI*2; // 2-4 full turns
  function spin(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t,3);
    wheelGroup.rotation.y = startRot + extra*eased;
    // ball orbits opposite
    const ball = wheelGroup.getObjectByName('ball');
    if(ball) {
      ball.position.x = Math.cos(-wheelGroup.rotation.y*2 + now*0.002)*2.6;
      ball.position.z = 2 + Math.sin(-wheelGroup.rotation.y*2 + now*0.002)*2.6;
    }
    if(t<1) requestAnimationFrame(spin);
    else {
      // determine pocket
      const pockets = 12;
      const finalAngle = (-wheelGroup.rotation.y) % (Math.PI*2);
      let idx = Math.floor((finalAngle + Math.PI*2) / (Math.PI*2) * pockets) % pockets;
      if(idx<0) idx += pockets;
      // win logic: 1/pockets chance exact, else 45% small win, else lose
      const exactChance = 1/pockets;
      if(Math.random() < exactChance){
        const payout = tier.stake * tier.mult;
        bankrollAdd(payout);
        messageEl.innerHTML = `Roulette: Exact hit on pocket ${idx}! You win ${fmt(payout)}.`;
      } else if(Math.random() < 0.45){
        const payout = Math.floor(tier.stake * (tier.mult/3));
        bankrollAdd(payout);
        messageEl.innerHTML = `Roulette: Lucky color/odd-even! You win ${fmt(payout)}.`;
      } else {
        messageEl.innerHTML = `Roulette: Ball landed on ${idx}. You lost ${fmt(tier.stake)}.`;
      }
      wheelSpinning = false;
      updateUI();
    }
  }
  requestAnimationFrame(spin);
}

/* -------------------------
   Bingo logic (simplified)
   ------------------------- */
function makeCard(){
  // 5x5 card with ranges per column
  const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const card = Array.from({length:5}, ()=>Array(5).fill(0));
  for(let c=0;c<5;c++){
    const pool = [];
    for(let n=ranges[c][0]; n<=ranges[c][1]; n++) pool.push(n);
    shuffle(pool);
    for(let r=0;r<5;r++){
      card[r][c] = pool[r];
    }
  }
  card[2][2] = 0; // free
  return card;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function checkBingo(card, drawn){
  // check rows, cols, diags
  const has = n => n===0 || drawn.includes(n);
  // rows
  for(let r=0;r<5;r++){
    let ok=true; for(let c=0;c<5;c++) if(!has(card[r][c])) { ok=false; break; }
    if(ok) return true;
  }
  // cols
  for(let c=0;c<5;c++){
    let ok=true; for(let r=0;r<5;r++) if(!has(card[r][c])) { ok=false; break; }
    if(ok) return true;
  }
  // diag
  let ok=true; for(let i=0;i<5;i++) if(!has(card[i][i])) { ok=false; break; } if(ok) return true;
  ok=true; for(let i=0;i<5;i++) if(!has(card[i][4-i])) { ok=false; break; } if(ok) return true;
  return false;
}

function playBingo(tier){
  bankroll -= tier.stake;
  updateUI();
  messageEl.textContent = `Buying Bingo card for ${fmt(tier.stake)}...`;
  const card = makeCard();
  const pool = Array.from({length:75}, (_,i)=>i+1);
  shuffle(pool);
  const drawn = [];
  let bingo=false;
  // draw up to 40 numbers
  for(let i=0;i<40;i++){
    drawn.push(pool[i]);
    if(checkBingo(card, drawn)){ bingo=true; break; }
  }
  if(bingo){
    const payout = tier.stake * tier.mult;
    bankrollAdd(payout);
    messageEl.innerHTML = `Bingo! You won ${fmt(payout)} after ${drawn.length} draws.`;
  } else {
    messageEl.innerHTML = `No Bingo after 40 draws. You lost ${fmt(tier.stake)}.`;
  }
  updateUI();
}

/* -------------------------
   Helpers & init
   ------------------------- */
function fmt(n){ return '$' + Math.floor(n).toLocaleString(); }
updateUI();

</script>
</body>
</html>
